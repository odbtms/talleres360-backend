# Microservicios Talleres360 (VM ec2-apps)
# Uso: docker compose -f infra/apps/compose.yml up -d --build
# Variables (infra/apps/.env): DB_USERNAME, DB_PASSWORD, ENTRA_TENANT_ID, API_CLIENT_ID
#
# Solo el BFF se publica hacia afuera. Postgres y los microservicios quedan en la red
# interna "talleres360": se hablan por nombre de servicio y no son alcanzables desde internet.

services:
  postgres:
    image: postgres:16-alpine
    container_name: talleres360-postgres
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: ${DB_USERNAME:-talleres360}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-talleres360}
    # Descomentar solo para inspeccionar la base desde el equipo local
    # ports:
    #   - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - talleres360

  orders:
    build: ../../ms-talleres360-orders
    image: talleres360/ms-orders:latest
    container_name: ms-talleres360-orders
    # Sin "ports": solo el BFF lo llama, por la red interna (http://orders:8081)
    expose:
      - "8081"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      TZ: America/Santiago
      DB_URL: jdbc:postgresql://postgres:5432/orders_db
      DB_USERNAME: ${DB_USERNAME:-talleres360}
      DB_PASSWORD: ${DB_PASSWORD:-talleres360}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - talleres360

  bff:
    build: ../../ms-talleres360-bff
    image: talleres360/ms-bff:latest
    container_name: ms-talleres360-bff
    ports:
      - "8080:8080"
    environment:
      TZ: America/Santiago
      # Identidades de Entra ID (no son secretos, pero van en infra/apps/.env)
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      API_CLIENT_ID: ${API_CLIENT_ID}
      ORDERS_URL: http://orders:8081
      # DEBUG para diagnosticar 401/403 (ver las authorities del token)
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: ${SECURITY_LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      - orders
    restart: unless-stopped
    networks:
      - talleres360

volumes:
  pgdata:

networks:
  talleres360:
    name: talleres360
