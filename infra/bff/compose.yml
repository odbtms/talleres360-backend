# BFF Talleres360 (VM ec2-bff)
# Uso: docker compose -f infra/bff/compose.yml up -d --build
# Variables (infra/bff/.env): ENTRA_TENANT_ID, API_CLIENT_ID, ORDERS_URL, CORS_ALLOWED_ORIGINS
#
# Unico servicio expuesto (8080, destino del API Gateway). Los microservicios viven en otra VM
# (ec2-apps) y se llaman por su IP privada: ORDERS_URL=http://<IP privada de ec2-apps>:8081

services:
  bff:
    build: ../../ms-talleres360-bff
    image: talleres360/ms-bff:latest
    container_name: ms-talleres360-bff
    ports:
      - "8080:8080"
    environment:
      TZ: America/Santiago
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      API_CLIENT_ID: ${API_CLIENT_ID}
      ORDERS_URL: ${ORDERS_URL}
      # DEBUG para diagnosticar 401/403 (ver las authorities del token)
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: ${SECURITY_LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    restart: unless-stopped
