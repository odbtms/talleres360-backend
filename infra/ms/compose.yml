# Microservicios Talleres360 (VM ec2-apps)
# Uso: docker compose -f infra/ms/compose.yml up -d --build
# Variables (infra/ms/.env): DB_USERNAME, DB_PASSWORD, CORS_ALLOWED_ORIGINS
#
# El BFF corre en otra VM (ec2-bff) y llama a orders por la IP privada de esta VM (puerto 8081).
# El security group de ec2-apps solo deja entrar al 8081 desde el security group del BFF.
# Postgres no publica puertos: solo lo ve orders por la red interna.

services:
  postgres:
    image: postgres:16-alpine
    container_name: talleres360-postgres
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: ${DB_USERNAME:-talleres360}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-talleres360}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - talleres360

  orders:
    build: ../../ms-talleres360-orders
    image: talleres360/ms-orders:latest
    container_name: ms-talleres360-orders
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      TZ: America/Santiago
      DB_URL: jdbc:postgresql://postgres:5432/orders_db
      DB_USERNAME: ${DB_USERNAME:-talleres360}
      DB_PASSWORD: ${DB_PASSWORD:-talleres360}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - talleres360

# Mismo nombre de volumen que infra/apps: conserva los datos que ya tenia la VM
volumes:
  pgdata:
    name: apps_pgdata

networks:
  talleres360:
    name: talleres360
